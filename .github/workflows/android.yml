name: Build PanelPop APK
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  build:
    # Imagen fija: evita roturas cuando GitHub cambia "ubuntu-latest"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: PanelPop-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
